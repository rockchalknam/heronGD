<!-- Original port by Martin_MMC. Classroom edition: relative paths, analytics stubbed, external links blocked. -->
<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Heron Dash</title>
    <meta name="description" content="Heron Dash - the official VRMS dash game. Fly Herons, Fly." />

    <!-- Styles -->
    <link rel="stylesheet" href="25081902/theme/game.css" />
    <style>
        .jss1:before {
            content: "";
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
            filter: blur(16px);
            background-size: cover;
            background-image: url("25081902/loading.png");
        }

        /* VRMS theme overrides */
        html, body { background-color: #0B1B36 !important; }
        #progress_fill {
            background-color: #F76B1C !important;
            animation-name: heronFill !important;
        }
        @keyframes heronFill {
            0%   { background-color: #F76B1C; }
            50%  { background-color: #FFA040; }
            100% { background-color: #F76B1C; }
        }
        .gameloader-game-name { color: #FFFFFF !important; }
    </style>

    <!-- Game Config (relative paths: works on any host) -->
    <script>
        const versionFolder = "25081902/";
        const basePath = versionFolder + "Build";
        const loaderUrl = basePath + "/geometry-lite-v25081902.loader.js";

        const config = {
            dataUrl: basePath + "/geometry-lite-v25081902.data.unityweb",
            frameworkUrl: basePath + "/geometry-lite-v25081902.framework.js.unityweb",
            codeUrl: basePath + "/geometry-lite-v25081902.wasm.unityweb",
            streamingAssetsUrl: versionFolder + "StreamingAssets",
            companyName: "1games.io",
            productName: "Dashmetry",
            productVersion: "25081902",
            pubId: "",
            hostindex: 2,
            gameId: "geometry-lite",
            eventLog: false,
            buildAPI: "",
            enableMoreGame: "no",
            enablePromotion: false,
            gdHost: false
        };
    </script>

    <!-- Classroom lock: blocks all navigation away from the game -->
    <script id="gmsoft-jssdk" src="classroom-lock.js"></script>
</head>

<body>
    <!-- Unity Canvas -->
    <div id="unity-container" style="display: none;">
        <canvas id="unity-canvas"></canvas>
    </div>

    <!-- Loading Screen -->
    <div id="loadingBlock">
        <div class="jss31 jss34 jss1">
            <div style="position: absolute; bottom: 10px; right: 10px; font-family: Arial, sans-serif; font-size: 18px; color: #fff; opacity: 0.5;">
                v25081902 &middot; Fly Herons, Fly
            </div>
            <div class="spinner"></div>

            <div class="jss31 jss34 jss48" style="flex: 1 1 0%;">
                <div class="jss32">
                    <div class="jss7 jss9 jss20 jss3">
                        <div class="jss125">
                            <div class="jss123"></div>
                            <img id="game-logo" src="25081902/logo.png" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="jss31 jss34" style="flex: 3 1 0%;">
                <div class="jss32">
                    <div class="jss31 jss34 jss39 jss50 gameloader">
                        <div class="jss32">
                            <div class="gameloader-game-name">Heron Dash</div>
                        </div>
                        <div class="jss32 gameloader-logo">
                            <img src="25081902/loading.png" />
                        </div>
                        <div class="jss32">
                            <div class="gameloader-progressbar">
                                <div class="gameloader-progressbar-progress" id="progress_fill" style="width: 0%;"></div>
                            </div>
                            <div class="gameloader-progress-info">Loading Game...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Unity Loader -->
    <script>
        const progressElement = document.getElementById('progress_fill');
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const loadingBar = document.querySelector("#loadingBlock");
        const progressText = document.querySelector(".gameloader-progress-info");

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const percent = Math.round(progress * 100);
                progressElement.style.width = percent + "%";
                progressText.innerText = percent >= 99 ? "Loading Game ..." : `Downloading file: ${percent}%`;
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                setTimeout(() => {
                    loadingBar.style.display = "none";
                    container.style.display = "block";
                    window.focus();
                }, 2000);
            }).catch(alert);
        };
        document.body.appendChild(script);
    </script>

    <!-- Analytics stubs: the Unity build calls these by name, so they must
         exist, but they no longer send anything anywhere. -->
    <script>
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {};

        /* The game's code reads firebaseConfig.projectId as an internal ID.
           Keep the name, strip the keys. No Firebase SDK is loaded. */
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "games-geometry-lite",
            storageBucket: "",
            messagingSenderId: "",
            appId: "",
            measurementId: ""
        };

        window.firebase = {
            initializeApp: function () {},
            analytics: function () {
                return {
                    setUserProperties: function () {},
                    logEvent: function () {}
                };
            }
        };

        function firebaseSetUserProperties(props) {}
        function firebaseLogEvent(eventName) {}
        function firebaseLogEventParameter(eventName, params) {}
    </script>
</body>

</html>
